<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>文献检索课缩略图</title>
  <rect width="800" height="600" fill="#0e2744"/>
  <rect x="48" y="48" width="280" height="150" rx="16" fill="#9a6700"/>
  <text x="72" y="118" fill="#fff6e4" font-size="42" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">12 条</text>
  <text x="72" y="164" fill="#fffaf3" font-size="24" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">不是空白</text>
  <rect x="360" y="64" width="390" height="46" rx="8" fill="#0f766e"/>
  <rect x="390" y="126" width="360" height="46" rx="8" fill="#16365c"/>
  <text x="56" y="300" fill="#8ee0d6" font-size="28" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">文献检索课</text>
  <text x="56" y="390" fill="#f6f1e7" font-size="52" font-weight="700" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">搜不到，</text>
  <text x="56" y="460" fill="#f6f1e7" font-size="52" font-weight="700" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">不等于不存在</text>
  <text x="56" y="530" fill="#d5ebe7" font-size="24" font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">图文自学 · 16:9 授课</text>
</svg>
