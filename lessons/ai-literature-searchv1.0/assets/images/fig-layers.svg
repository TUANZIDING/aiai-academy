<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img">
  <title>题录、摘要、全文是三层</title>
  <desc>教学整理。snippet 不是摘要。检索命中不带来全文权利。</desc>
  <rect width="960" height="460" rx="28" fill="#f6f1e7"/>
  <g font-family="WenQuanYi Micro Hei, Microsoft YaHei, sans-serif">
    <rect x="40" y="36" width="560" height="100" rx="16" fill="#fffaf3" stroke="#0e2744" stroke-width="3"/>
    <text x="64" y="78" fill="#0e2744" font-size="32" font-weight="700">1 题录</text>
    <text x="64" y="112" fill="#1c1915" font-size="22">题名、作者、年份、DOI。有记录不等于读过。</text>
    <rect x="70" y="156" width="530" height="100" rx="16" fill="#e5f4f1" stroke="#0f766e" stroke-width="3"/>
    <text x="94" y="198" fill="#0f766e" font-size="32" font-weight="700">2 摘要</text>
    <text x="94" y="232" fill="#1c1915" font-size="22">作者摘要，或来源标明的一句话摘要。</text>
    <rect x="100" y="276" width="500" height="100" rx="16" fill="#0e2744"/>
    <text x="124" y="318" fill="#f6f1e7" font-size="32" font-weight="700">3 全文</text>
    <text x="124" y="352" fill="#d5ebe7" font-size="22">开放获取或图书馆。命中不产生权利。</text>
    <rect x="650" y="156" width="270" height="150" rx="16" fill="#fff6e4" stroke="#9a6700" stroke-width="3"/>
    <text x="674" y="210" fill="#9a6700" font-size="36" font-weight="700">snippet</text>
    <text x="674" y="258" fill="#6d4a09" font-size="28" font-weight="700">不是摘要</text>
    <text x="650" y="360" fill="#0f766e" font-size="20">教学整理</text>
  </g>
</svg>
