<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 思考短片 · 逐句精听 | aiai</title><link rel="stylesheet" href="../assets/listening.css?v=3"></head>

<section aria-label="横向短片选择"><div class="shelf-heading"><h2>本期选片 · 10 段</h2><div><button id="prev" aria-label="向左选片">←</button> <button id="next" aria-label="向右选片">→</button></div></div><div id="films" class="films"></div></section>
